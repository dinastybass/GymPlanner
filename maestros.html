<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maestros - GO & train</title>
    <link rel="icon" type="image/png" href="assets/logo.png">

    <link rel="stylesheet" href="styles.css?v=3">
    <script src="nav-component.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>

    <style>
        .maestros-layout {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 25px;
            align-items: start;
        }

        @media (max-width: 850px) {
            .maestros-layout {
                grid-template-columns: 1fr;
            }
        }

        .sidebar-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.04);
        }

        .sec-group {
            margin-bottom: 18px;
        }

        .sec-group:last-child {
            margin-bottom: 0;
        }

        .sec-title {
            font-size: 0.75rem;
            font-weight: 800;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 0.6px;
            padding: 6px 10px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 6px;
        }

        .clave-btn {
            width: 100%;
            text-align: left;
            background: transparent;
            border: none;
            padding: 9px 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            color: var(--text-main);
            font-weight: 500;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.15s;
        }

        .clave-btn:hover {
            background: var(--hover-bg);
        }

        .clave-btn.active {
            background: #e0f2fe;
            color: #0369a1;
            font-weight: 700;
        }

        .count-pill {
            font-size: 0.75rem;
            background: var(--hover-bg);
            color: var(--text-muted);
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: 600;
        }

        .clave-btn.active .count-pill {
            background: #bae6fd;
            color: #0369a1;
        }

        .add-bar {
            display: flex;
            gap: 10px;
            background: var(--hover-bg);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border);
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .add-bar input[type="text"] {
            flex: 1;
            min-width: 200px;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.95rem;
        }

        .maestros-table th,
        .maestros-table td {
            font-size: 0.9rem;
        }

        .maestros-table th {
            font-size: 0.75rem;
            text-transform: uppercase;
            background: var(--hover-bg);
        }

        .maestro-row {
            background: var(--surface);
            transition: background 0.15s;
        }

        .maestro-row:hover {
            background: #f8fafc;
        }

        .drag-cell {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .orden-badge {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 700;
            min-width: 22px;
        }

        .action-btns {
            justify-content: flex-end;
        }
        .perfiles-subcard { margin-top: 24px; border-top: 2px solid var(--border); padding-top: 22px; }
        .perfiles-subcard h3 { margin: 0 0 6px 0; font-size: 1.15rem; color: var(--accent-dark); }
        .perfiles-subcard p.sub-desc { margin: 0 0 16px 0; font-size: 0.88rem; color: var(--text-muted); }
        .role-badge { display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 999px; font-size: 0.78rem; font-weight: 700; background: #e0f2fe; color: #0369a1; text-transform: capitalize; }
        .role-select-inline { padding: 6px 10px; border-radius: 6px; border: 1px solid var(--border); font-size: 0.88rem; font-weight: 600; background: var(--surface); color: var(--text-main); cursor: pointer; }
        .perm-cat-row td { background: #f1f5f9; font-weight: 800; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.5px; color: var(--accent-dark); padding: 10px 14px !important; }
        .perm-check { width: 18px; height: 18px; accent-color: var(--accent-dark); cursor: pointer; }
        .perm-desc { display: block; font-size: 0.8rem; color: var(--text-muted); font-weight: 400; margin-top: 2px; }
        }
    </style>
</head>

<body>
    <gym-navbar active="maestros"></gym-navbar>

    <div class="container">
        <div class="page-header">
            <div>
                <h1>Gestor de Maestros</h1>
                <p style="margin: 4px 0 0 0; color: var(--text-muted); font-size: 0.9rem;">Configuración centralizada de
                    Secciones, Claves y Valores de toda la aplicación.</p>
            </div>
        </div>

        <div class="maestros-layout">
            <!-- MENÚ LATERAL IZQUIERDO -->
            <aside class="sidebar-card" id="sidebarMaestros"></aside>

            <!-- PANEL PRINCIPAL DERECHO -->
            <main class="card">
                <div
                    style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; border-bottom:1px solid var(--border); padding-bottom:15px;">
                    <div>
                        <span class="breadcrumb" id="uiSeccion"
                            style="margin:0; font-weight:700; text-transform:uppercase;">EJERCICIOS</span>
                        <h2 id="uiClave" style="margin:4px 0 0 0; font-size:1.4rem;">Niveles</h2>
                    </div>
                    <span id="uiTotal" style="color:var(--text-muted); font-size:0.9rem; font-weight:600;">0
                        valores</span>
                </div>

                <form class="add-bar" id="formMaestro">
                    <input type="hidden" id="editId" value="">
                    <input type="text" id="inputValor" placeholder="Escribe el nuevo valor (se añadirá al final)..."
                        required>
                    <button type="submit" class="btn-primary" id="btnGuardar">Añadir valor</button>
                    <button type="button" class="btn-secondary" id="btnCancelar" style="display:none;">Cancelar</button>
                </form>

                <div style="overflow-x:auto;">
                    <table id="tablaPrincipalMaestros" class="maestros-table">
                        <thead>
                            <tr>
                                <th style="width:90px;">Orden</th>
                                <th>Valor</th>
                                <th style="text-align:right; width:160px;">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tablaValores">
                            <tr>
                                <td colspan="3" style="text-align:center; padding:30px; color:var(--text-muted);">
                                    Cargando maestros...</td>
                            </tr>
                        </tbody>
                    </table>
                <!-- PANEL ADICIONAL PARA GESTIÓN DE PERFILES (ROLES / PERMISOS) -->
                <div id="panelExtraPerfiles" style="display:none;"></div>
                </div>
            </main>
        </div>
    </div>

    <!-- MODAL AVISO DEPENDENCIAS -->
    <div class="modal-overlay" id="modalDependencias" style="display:none; align-items:center; justify-content:center;">
        <div class="modal-content" style="max-width: 450px;">
            <h2 style="margin-top:0; color:#b91c1c;">⚠️ Elemento en uso</h2>
            <p id="depMensaje" style="color:var(--text-muted); font-size:0.9rem; line-height:1.4;"></p>

            <div class="form-group" style="margin: 20px 0;">
                <label>¿Qué deseas hacer con los elementos afectados?</label>
                <select id="selectAlternativa" class="form-control"
                    style="width:100%; padding:10px; border-radius:6px; border:1px solid var(--border);">
                    <option value="dejar_vacio">Dejar el campo vacío</option>
                    <option value="reasignar">Reasignar a otro valor existente</option>
                </select>
            </div>

            <div class="form-group" id="boxReasignar" style="display:none; margin-bottom: 20px;">
                <label>Selecciona el nuevo valor:</label>
                <select id="selectNuevoValor" class="form-control"
                    style="width:100%; padding:10px; border-radius:6px; border:1px solid var(--border);"></select>
            </div>

            <div style="display: flex; justify-content: flex-end; gap: 10px;">
                <button type="button" class="btn-secondary"
                    onclick="document.getElementById('modalDependencias').style.display='none'">Cancelar</button>
                <button type="button" class="btn-primary" id="btnConfirmarBorrado" style="background:#dc2626;">Confirmar
                    Borrado</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { auth, db } from './firebase-config.js';
        import { doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";
        import {
            ESTRUCTURA_MAESTROS, cargarTodosLosMaestros, limpiarCacheMaestros,
            guardarValorMaestro, reordenarValoresMaestro, eliminarValorMaestro,
            comprobarDependenciasMaestro, reasignarOQuitarDependencia,
            CATALOGO_PERMISOS_APP, PermisosPorDefectoParaRol, asegurarRolesYPermisosIniciales,
            cargarMatrizPermisos, guardarMatrizPermisos, cargarUsuariosAutenticacion, generarIdItem
        } from './js/maestros-service.js';
        import { iconTrash } from './js/utils.js';
        import { mostrarToastDeshacer, ejecutarOperacionesFirestore, serializarDatosFirestore } from './js/undo-service.js';

        let mapaMaestros = {};
        let seccionActual = "Ejercicios";
        let claveActual = "Niveles";
        let sortableInstance = null;

        function renderSidebar() {
            const sb = document.getElementById('sidebarMaestros');
            if (!sb) return;
            sb.innerHTML = '';

            for (const [sec, claves] of Object.entries(ESTRUCTURA_MAESTROS)) {
                const group = document.createElement('div');
                group.className = 'sec-group';
                group.innerHTML = `<div class="sec-title">${sec}</div>`;

                claves.forEach(clv => {
                    const count = (mapaMaestros[sec] && mapaMaestros[sec][clv]) ? mapaMaestros[sec][clv].length : 0;
                    const btn = document.createElement('button');
                    btn.className = `clave-btn ${(sec === seccionActual && clv === claveActual) ? 'active' : ''}`;
                    btn.innerHTML = `<span>${clv}</span><span class="count-pill">${count}</span>`;
                    btn.onclick = () => seleccionarClave(sec, clv);
                    group.appendChild(btn);
                });

                sb.appendChild(group);
            }
        }

        function seleccionarClave(sec, clv) {
            seccionActual = sec;
            claveActual = clv;
            resetFormulario();
            renderSidebar();
            renderTabla();
        }

        function initSortableTabla() {
            const tbody = document.getElementById('tablaValores');
            if (!tbody) return;

            if (sortableInstance) {
                sortableInstance.destroy();
                sortableInstance = null;
            }

            const lista = (mapaMaestros[seccionActual] && mapaMaestros[seccionActual][claveActual]) || [];
            if (lista.length <= 1) return;

            sortableInstance = new Sortable(tbody, {
                animation: 150,
                handle: '.drag-handle',
                ghostClass: 'sortable-ghost',
                onEnd: async function () {
                    const filas = Array.from(tbody.querySelectorAll('tr.maestro-row'));
                    if (filas.length === 0) return;

                    const listaActual = (mapaMaestros[seccionActual] && mapaMaestros[seccionActual][claveActual]) || [];
                    const nuevaLista = filas.map((tr, idx) => {
                        const id = tr.getAttribute('data-id');
                        const itemOriginal = listaActual.find(x => x.id === id);
                        return {
                            id: id,
                            valor: itemOriginal ? itemOriginal.valor : tr.getAttribute('data-valor'),
                            orden: idx + 1
                        };
                    });

                    // Actualizamos en memoria y refrescamos numeración visual al instante
                    mapaMaestros[seccionActual][claveActual] = nuevaLista;
                    renderTabla();

                    try {
                        await reordenarValoresMaestro(seccionActual, claveActual, nuevaLista);
                    } catch (err) {
                        console.error("Error guardando el nuevo orden:", err);
                        alert("No se pudo guardar el nuevo orden: " + err.message);
                        try { await asegurarRolesYPermisosIniciales(); } catch (e) { console.warn("Aviso inicializando perfiles:", e); }
            await recargarVista();
                    }
                }
            });
        }

        function renderTabla() {
            const secEl = document.getElementById('uiSeccion');
            const clvEl = document.getElementById('uiClave');
            const totalEl = document.getElementById('uiTotal');
            const tbody = document.getElementById('tablaValores');

            if (!secEl || !tbody) return;

            secEl.innerText = `SECCIÓN · ${seccionActual}`;
            clvEl.innerText = claveActual;

            const lista = (mapaMaestros[seccionActual] && mapaMaestros[seccionActual][claveActual]) || [];
            totalEl.innerText = `${lista.length} valor(es)`;

            if (lista.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" style="text-align:center; padding:30px; color:var(--text-muted);">No hay valores registrados en esta clave.</td></tr>`;
                return;
            }

            tbody.innerHTML = lista.map((item, idx) => `
                <tr class="maestro-row" data-id="${item.id}" data-valor="${item.valor.replace(/"/g, '&quot;')}">
                    <td>
                        <div class="drag-cell">
                            <span class="drag-handle" title="Arrastra para cambiar el orden">⋮⋮</span>
                            <span class="orden-badge">${idx + 1}</span>
                        </div>
                    </td>
                    <td style="font-weight:600;">${item.valor}</td>
                    <td>
                        <div class="action-btns">
                            <button class="btn-icon" onclick="window.editarItem('${item.id}', '${item.valor.replace(/'/g, "\\'")}')">Editar</button>
                            <button class="btn-icon danger" onclick="window.borrarItem('${claveActual}', '${item.id}', '${item.valor.replace(/'/g, "\\'")}')" title="Eliminar">${iconTrash}</button>
                        </div>
                    </td>
                </tr>
            `).join('');

            initSortableTabla();
            renderPanelExtraPerfiles();
        }

        async function renderPanelExtraPerfiles() {
            const panelExtra = document.getElementById('panelExtraPerfiles');
            const inputValor = document.getElementById('inputValor');
            const btnGuardar = document.getElementById('btnGuardar');
            if (!panelExtra) return;

            if (inputValor && !document.getElementById('editId').value) {
                if (seccionActual === "Gestión de Perfiles" && claveActual === "Roles") {
                    inputValor.placeholder = "Escribe el nombre del nuevo Rol (ej: Recepción, Fisioterapeuta, Entrenador)...";
                    if (btnGuardar) btnGuardar.innerText = "Dar de alta Rol";
                } else if (seccionActual === "Gestión de Perfiles" && claveActual === "Permisos") {
                    inputValor.placeholder = "Añadir nueva acción / permiso personalizado a la lista...";
                    if (btnGuardar) btnGuardar.innerText = "Añadir Permiso";
                } else {
                    inputValor.placeholder = "Escribe el nuevo valor (se añadirá al final)...";
                    if (btnGuardar) btnGuardar.innerText = "Añadir valor";
                }
            }

            if (seccionActual !== "Gestión de Perfiles") {
                panelExtra.style.display = 'none';
                panelExtra.innerHTML = '';
                return;
            }

            panelExtra.style.display = 'block';

            if (claveActual === "Roles") {
                panelExtra.innerHTML = `<div class="perfiles-subcard"><p style="color:var(--text-muted);">Cargando empleados en autenticación...</p></div>`;
                const rolesItems = (mapaMaestros["Gestión de Perfiles"] && mapaMaestros["Gestión de Perfiles"]["Roles"]) || [];
                const listaRoles = rolesItems.map(r => r.valor);
                const usuarios = await cargarUsuariosAutenticacion();

                const opcionesRolesHTML = (rolActual) => {
                    const normActual = String(rolActual || '').trim().toLowerCase();
                    let opts = `<option value="">-- Sin rol asignado --</option>`;
                    let encontrado = false;
                    listaRoles.forEach(r => {
                        const sel = r.trim().toLowerCase() === normActual ? 'selected' : '';
                        if (sel) encontrado = true;
                        opts += `<option value="${r.replace(/"/g, '&quot;')}" ${sel}>${r}</option>`;
                    });
                    if (!encontrado && rolActual && rolActual !== 'Sin asignar') {
                        opts += `<option value="${rolActual.replace(/"/g, '&quot;')}" selected>${rolActual} (Actual)</option>`;
                    }
                    return opts;
                };

                const filasUsuarios = usuarios.length === 0
                    ? `<tr><td colspan="4" style="text-align:center; padding:20px; color:var(--text-muted);">No se encontraron empleados en <code>usuarios_app</code>. Usa el formulario inferior para registrar un empleado de autenticación.</td></tr>`
                    : usuarios.map(u => `
                        <tr class="maestro-row">
                            <td style="font-weight:700;">
                                ${u.nombre}
                                ${u.alias && u.alias !== u.nombre ? `<span style="display:block; font-size:0.78rem; color:var(--text-muted); font-weight:400;">Alias: ${u.alias}</span>` : ''}
                            </td>
                            <td style="color:var(--text-muted); font-size:0.86rem;">${u.email || u.id}</td>
                            <td>
                                <span class="role-badge" id="badge-rol-${u.id.replace(/[^a-zA-Z0-9_-]/g, '_')}">${u.rol || 'Sin asignar'}</span>
                            </td>
                            <td style="text-align:right;">
                                <select class="role-select-inline" onchange="window.asignarRolEmpleado('${u.id.replace(/'/g, "\\'")}', this.value, '${(u.rol || '').replace(/'/g, "\\'")}', '${u.nombre.replace(/'/g, "\\'")}')">
                                    ${opcionesRolesHTML(u.rol)}
                                </select>
                            </td>
                        </tr>
                    `).join('');

                const selectNuevoEmpRoles = listaRoles.map(r => `<option value="${r.replace(/"/g, '&quot;')}">${r}</option>`).join('');

                panelExtra.innerHTML = `
                    <div class="perfiles-subcard">
                        <h3>👥 Empleados en Autenticación y Asignación de Roles</h3>
                        <p class="sub-desc">Visualiza los empleados registrados en autenticación (colección <code>usuarios_app</code>), consulta su rol actual y asígnales cualquiera de los Roles dados de alta arriba.</p>

                        <div style="overflow-x:auto; margin-bottom:18px;">
                            <table class="maestros-table">
                                <thead>
                                    <tr>
                                        <th>Empleado</th>
                                        <th>Cuenta / Email (Auth)</th>
                                        <th>Rol Actual</th>
                                        <th style="text-align:right;">Asignar / Cambiar Rol</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${filasUsuarios}
                                </tbody>
                            </table>
                        </div>

                        <div style="background: var(--hover-bg); padding: 14px; border-radius: 8px; border: 1px solid var(--border);">
                            <div style="font-weight: 700; font-size: 0.88rem; margin-bottom: 10px; color: var(--text-main);">➕ Registrar / Vincular empleado de Firebase Authentication</div>
                            <div style="display: flex; gap: 10px; flex-wrap: wrap; align-items: center;">
                                <input type="email" id="nuevoEmpEmail" placeholder="Email en Authentication (ej: entrenador@goandtrain.com)" style="flex: 1.5; min-width: 210px; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.88rem;">
                                <input type="text" id="nuevoEmpNombre" placeholder="Nombre / Alias (ej: Carlos)" style="flex: 1; min-width: 140px; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.88rem;">
                                <select id="nuevoEmpRol" class="role-select-inline" style="min-width: 140px; padding: 8px 10px;">
                                    ${selectNuevoEmpRoles}
                                </select>
                                <button type="button" class="btn-primary" onclick="window.guardarNuevoEmpleadoAuth()" style="padding: 8px 14px; font-size: 0.88rem;">Guardar Empleado</button>
                            </div>
                        </div>
                    </div>
                `;
            } else if (claveActual === "Permisos") {
                panelExtra.innerHTML = `<div class="perfiles-subcard"><p style="color:var(--text-muted);">Cargando matriz de permisos de la aplicación...</p></div>`;
                const rolesItems = (mapaMaestros["Gestión de Perfiles"] && mapaMaestros["Gestión de Perfiles"]["Roles"]) || [];
                const listaRoles = rolesItems.length > 0 ? rolesItems.map(r => r.valor) : ['admin', 'programador'];
                const matriz = await cargarMatrizPermisos();

                // Combinar catálogo oficial con cualquier permiso extra dado de alta en el maestro "Permisos"
                const permisosMaestro = (mapaMaestros["Gestión de Perfiles"] && mapaMaestros["Gestión de Perfiles"]["Permisos"]) || [];
                const nombresCatalogo = new Set(CATALOGO_PERMISOS_APP.map(p => p.nombre.toLowerCase()));
                const catalogoCompleto = [...CATALOGO_PERMISOS_APP];

                permisosMaestro.forEach(pm => {
                    if (!nombresCatalogo.has(pm.valor.toLowerCase())) {
                        catalogoCompleto.push({
                            id: generarIdItem(pm.valor),
                            categoria: "Permisos Personalizados",
                            nombre: pm.valor,
                            descripcion: "Acción personalizada dada de alta en el maestro de Permisos."
                        });
                    }
                });

                const porCategoria = {};
                catalogoCompleto.forEach(p => {
                    if (!porCategoria[p.categoria]) porCategoria[p.categoria] = [];
                    porCategoria[p.categoria].push(p);
                });

                const thRoles = listaRoles.map(r => `<th style="text-align:center; min-width:110px;">${r}</th>`).join('');

                let filasMatrizHTML = '';
                for (const [cat, acciones] of Object.entries(porCategoria)) {
                    filasMatrizHTML += `<tr class="perm-cat-row"><td colspan="${listaRoles.length + 1}">📌 ${cat}</td></tr>`;
                    acciones.forEach(acc => {
                        const celdasRoles = listaRoles.map(rol => {
                            const permisosRol = matriz[rol] || PermisosPorDefectoParaRol(rol);
                            const activo = permisosRol[acc.id] !== undefined ? Boolean(permisosRol[acc.id]) : Boolean(PermisosPorDefectoParaRol(rol)[acc.id]);
                            return `
                                <td style="text-align:center; vertical-align:middle;">
                                    <input type="checkbox" class="perm-check" ${activo ? 'checked' : ''}
                                        onchange="window.togglePermisoRol('${rol.replace(/'/g, "\\'")}', '${acc.id}', this.checked, '${acc.nombre.replace(/'/g, "\\'")}')"
                                        title="${activo ? 'Permitido' : 'Denegado'} para ${rol}">
                                </td>
                            `;
                        }).join('');

                        filasMatrizHTML += `
                            <tr class="maestro-row">
                                <td>
                                    <span style="font-weight:700; color:var(--text-main);">${acc.nombre}</span>
                                    <span class="perm-desc">${acc.descripcion}</span>
                                </td>
                                ${celdasRoles}
                            </tr>
                        `;
                    });
                }

                panelExtra.innerHTML = `
                    <div class="perfiles-subcard">
                        <h3>🔐 Matriz de Permisos por Rol (Acciones de la Aplicación)</h3>
                        <p class="sub-desc">Activa o desactiva qué acciones puede realizar cada Rol dentro de la aplicación. Los cambios se guardan automáticamente.</p>
                        <div style="overflow-x:auto;">
                            <table class="maestros-table">
                                <thead>
                                    <tr>
                                        <th>Acción / Permiso en la Aplicación</th>
                                        ${thRoles}
                                    </tr>
                                </thead>
                                <tbody>
                                    ${filasMatrizHTML}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
            }
        }

        window.asignarRolEmpleado = async (docId, nuevoRol, rolAnterior, nombreEmpleado) => {
            try {
                const ref = doc(db, "usuarios_app", docId);
                await setDoc(ref, { rol: nuevoRol }, { merge: true });
                if (auth.currentUser && auth.currentUser.email === docId) {
                    localStorage.setItem('userRole', nuevoRol);
                }
                await renderPanelExtraPerfiles();
                mostrarToastDeshacer(`👤 Rol de ${nombreEmpleado} actualizado a "${nuevoRol || 'Sin rol'}"`, async () => {
                    await setDoc(ref, { rol: rolAnterior }, { merge: true });
                    await renderPanelExtraPerfiles();
                });
            } catch (e) {
                console.error("Error asignando rol:", e);
                alert("No se pudo actualizar el rol del empleado: " + e.message);
            }
        };

        window.guardarNuevoEmpleadoAuth = async () => {
            const emailEl = document.getElementById('nuevoEmpEmail');
            const nombreEl = document.getElementById('nuevoEmpNombre');
            const rolEl = document.getElementById('nuevoEmpRol');
            const email = (emailEl?.value || '').trim().toLowerCase();
            const nombre = (nombreEl?.value || '').trim();
            const rol = (rolEl?.value || 'programador').trim();

            if (!email || !email.includes('@')) {
                alert("Introduce el email válido del empleado en Firebase Authentication.");
                return;
            }
            if (!nombre) {
                alert("Introduce el nombre o alias del empleado.");
                return;
            }

            try {
                const ref = doc(db, "usuarios_app", email);
                await setDoc(ref, {
                    email,
                    nombre,
                    alias: nombre,
                    rol,
                    es_programador: true
                }, { merge: true });
                emailEl.value = '';
                nombreEl.value = '';
                await renderPanelExtraPerfiles();
                mostrarToastDeshacer(`👤 Empleado "${nombre}" vinculado con rol "${rol}"`, async () => {
                    await renderPanelExtraPerfiles();
                });
            } catch (e) {
                console.error("Error registrando empleado:", e);
                alert("No se pudo guardar el empleado: " + e.message);
            }
        };

        window.togglePermisoRol = async (rol, permId, nuevoEstado, nombrePermiso) => {
            try {
                const matrizActual = await cargarMatrizPermisos();
                const estadoPrevio = matrizActual[rol] ? Boolean(matrizActual[rol][permId]) : !nuevoEstado;
                if (!matrizActual[rol]) matrizActual[rol] = PermisosPorDefectoParaRol(rol);
                matrizActual[rol][permId] = Boolean(nuevoEstado);
                await guardarMatrizPermisos(matrizActual);

                mostrarToastDeshacer(`🔐 Permiso "${nombrePermiso}" ${nuevoEstado ? 'activado' : 'desactivado'} para ${rol}`, async () => {
                    matrizActual[rol][permId] = estadoPrevio;
                    await guardarMatrizPermisos(matrizActual);
                    await renderPanelExtraPerfiles();
                });
            } catch (e) {
                console.error("Error actualizando permiso:", e);
                alert("No se pudo guardar el permiso: " + e.message);
            }
        };

        function _unusedInitEnd() {
        }

        window.editarItem = (id, valor) => {
            document.getElementById('editId').value = id;
            document.getElementById('inputValor').value = valor;
            document.getElementById('btnGuardar').innerText = "Actualizar";
            document.getElementById('btnCancelar').style.display = "inline-flex";
            document.getElementById('inputValor').focus();
        };

        function resetFormulario() {
            const editId = document.getElementById('editId');
            const valInput = document.getElementById('inputValor');
            const btnGuardar = document.getElementById('btnGuardar');
            const btnCancelar = document.getElementById('btnCancelar');

            if (editId) editId.value = '';
            if (valInput) valInput.value = '';
            if (btnGuardar) btnGuardar.innerText = "Añadir valor";
            if (btnCancelar) btnCancelar.style.display = "none";
        }

        document.addEventListener('DOMContentLoaded', () => {
            const btnCancel = document.getElementById('btnCancelar');
            if (btnCancel) btnCancel.addEventListener('click', resetFormulario);

            const formMaestro = document.getElementById('formMaestro');
            if (formMaestro) {
                formMaestro.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const valor = document.getElementById('inputValor').value.trim();
                    const editId = document.getElementById('editId').value.trim();
                    if (!valor) return;

                    document.getElementById('btnGuardar').innerText = "Guardando...";

                    try {
                        const listaActual = (mapaMaestros[seccionActual] && mapaMaestros[seccionActual][claveActual]) || [];
                        let ordenCalculado = listaActual.length + 1;

                        if (editId) {
                            const idxExistente = listaActual.findIndex(x => x.id === editId);
                            if (idxExistente !== -1) {
                                ordenCalculado = idxExistente + 1;
                            }
                        }

                        await guardarValorMaestro(seccionActual, claveActual, valor, ordenCalculado, editId || null);
                        resetFormulario();
                        try { await asegurarRolesYPermisosIniciales(); } catch (e) { console.warn("Aviso inicializando perfiles:", e); }
            await recargarVista();
                    } catch (err) {
                        alert("Error al guardar: " + err.message);
                        document.getElementById('btnGuardar').innerText = editId ? "Actualizar" : "Añadir valor";
                    }
                });
            }
        });

        async function reindexarTrasBorrado(clave, itemIdEliminado) {
            const listaRestante = ((mapaMaestros[seccionActual] && mapaMaestros[seccionActual][clave]) || [])
                .filter(item => item.id !== itemIdEliminado);
            await reordenarValoresMaestro(seccionActual, clave, listaRestante);
        }

        window.borrarItem = async (clave, itemId, valor) => {
            const seccionRespaldo = seccionActual;
            const listaPrevia = [...((mapaMaestros[seccionActual] && mapaMaestros[seccionActual][clave]) || [])];
            const dependencias = await comprobarDependenciasMaestro(clave, valor);

            if (dependencias.length > 0) {
                const modal = document.getElementById('modalDependencias');
                const mensaje = document.getElementById('depMensaje');
                const selectAlt = document.getElementById('selectAlternativa');
                const boxReasignar = document.getElementById('boxReasignar');
                const selectNuevo = document.getElementById('selectNuevoValor');

                mensaje.innerHTML = `El valor <strong>"${valor}"</strong> está siendo utilizado actualmente por <strong>${dependencias.length}</strong> registro(s) en el sistema. Si lo eliminas, debes decidir qué hacer con ellos.`;

                const listaActual = (mapaMaestros[seccionActual] && mapaMaestros[seccionActual][clave]) || [];
                selectNuevo.innerHTML = listaActual.filter(item => item.valor !== valor).map(item => `<option value="${item.valor}">${item.valor}</option>`).join('');

                selectAlt.onchange = (e) => {
                    boxReasignar.style.display = e.target.value === 'reasignar' ? 'block' : 'none';
                };
                selectAlt.value = 'dejar_vacio';
                boxReasignar.style.display = 'none';

                modal.style.display = 'flex';

                document.getElementById('btnConfirmarBorrado').onclick = async () => {
                    const opcion = selectAlt.value;
                    const nuevoVal = opcion === 'reasignar' ? selectNuevo.value : "";

                    document.getElementById('btnConfirmarBorrado').innerText = "Procesando...";

                    try {
                        // Capturar copia de seguridad de los documentos dependientes antes de modificarlos
                        const opsRestaurarDeps = [];
                        for (const dep of dependencias) {
                            const snapDep = await getDoc(doc(db, dep.coleccion, dep.id));
                            if (snapDep.exists()) {
                                opsRestaurarDeps.push({
                                    type: 'set',
                                    collection: dep.coleccion,
                                    id: dep.id,
                                    data: serializarDatosFirestore(snapDep.data()),
                                    merge: false
                                });
                            }
                        }

                        await reasignarOQuitarDependencia(clave, valor, nuevoVal);
                        await eliminarValorMaestro(clave, itemId);
                        await reindexarTrasBorrado(clave, itemId);

                        modal.style.display = 'none';
                        document.getElementById('btnConfirmarBorrado').innerText = "Confirmar Borrado";
                        try { await asegurarRolesYPermisosIniciales(); } catch (e) { console.warn("Aviso inicializando perfiles:", e); }
            await recargarVista();

                        mostrarToastDeshacer(`🗑️ Valor "${valor}" eliminado (${dependencias.length} reg. actualizados)`, async () => {
                            await reordenarValoresMaestro(seccionRespaldo, clave, listaPrevia);
                            await ejecutarOperacionesFirestore(opsRestaurarDeps);
                            try { await asegurarRolesYPermisosIniciales(); } catch (e) { console.warn("Aviso inicializando perfiles:", e); }
            await recargarVista();
                        });
                    } catch (err) {
                        alert("Error al procesar: " + err.message);
                        document.getElementById('btnConfirmarBorrado').innerText = "Confirmar Borrado";
                    }
                };

            } else {
                if (!confirm(`¿Seguro que deseas eliminar "${valor}" de ${clave}?`)) return;
                try {
                    await eliminarValorMaestro(clave, itemId);
                    await reindexarTrasBorrado(clave, itemId);
                    try { await asegurarRolesYPermisosIniciales(); } catch (e) { console.warn("Aviso inicializando perfiles:", e); }
            await recargarVista();

                    mostrarToastDeshacer(`🗑️ Valor "${valor}" eliminado de ${clave}`, async () => {
                        await reordenarValoresMaestro(seccionRespaldo, clave, listaPrevia);
                        try { await asegurarRolesYPermisosIniciales(); } catch (e) { console.warn("Aviso inicializando perfiles:", e); }
            await recargarVista();
                    });
                } catch (err) {
                    alert("No se pudo eliminar: " + err.message);
                }
            }
        };

        async function recargarVista() {
            try {
                limpiarCacheMaestros();
                mapaMaestros = await cargarTodosLosMaestros(true);
                renderSidebar();
                renderTabla();
            } catch (e) {
                console.error("Error al cargar maestros:", e);
                const tbody = document.getElementById('tablaValores');
                if (tbody) tbody.innerHTML = `<tr><td colspan="3" style="text-align:center; padding:30px; color:red;">Error de carga: ${e.message}</td></tr>`;
            }
        }

        // Solo requiere que el usuario esté autenticado en Firebase
        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = "index.html";
                return;
            }
            try { await asegurarRolesYPermisosIniciales(); } catch (e) { console.warn("Aviso inicializando perfiles:", e); }
            await recargarVista();
        });
    </script>
</body>

</html>
