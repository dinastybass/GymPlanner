<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Página no encontrada - GO & train</title>
  <link rel="icon" type="image/png" href="assets/logo.png">

  <!-- Hoja de estilos centralizada -->
  <link rel="stylesheet" href="styles.css">

  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }

    .error-card {
      max-width: 450px;
      padding: 50px 30px;
    }

    .error-card img {
      width: 150px;
      margin-bottom: 20px;
      opacity: 0.8;
    }

    .error-card h1 {
      font-size: 3.5rem;
      color: var(--accent-dark);
      margin: 0 0 10px 0;
      line-height: 1;
    }

    .error-card h2 {
      font-size: 1.2rem;
      color: var(--text-main);
      margin: 0 0 15px 0;
    }

    .error-card p {
      color: var(--text-muted);
      margin-bottom: 30px;
      font-size: 0.95rem;
    }
  </style>
</head>

<body>
  <div class="card error-card">
    <img src="assets/logo.png" alt="GO & train Logo">
    <h1>404</h1>
    <h2>Página no encontrada</h2>
    <p>La ruta a la que intentas acceder no existe o el recurso ha sido movido. Verifica la URL e inténtalo de nuevo.
    </p>
    <a href="index.html" class="btn-primary"
      style="justify-content: center; width: 100%; box-sizing: border-box;">Volver al Inicio</a>
  </div>
</body>

</html>
