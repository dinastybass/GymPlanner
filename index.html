<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GO & train - Acceso</title>
    <link rel="icon" type="image/png" href="assets/logo.png">

    <!-- Enlazamos la nueva hoja de estilos unificada -->
    <link rel="stylesheet" href="styles.css?v=3">

    <style>
        /* Mantenemos aquí únicamente los estilos específicos y únicos de esta pantalla de Login */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-card {
            background: var(--surface);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 340px;
            border: 1px solid #e5e7eb;
            text-align: center;
        }

        .logo-container {
            margin-bottom: 30px;
        }

        .logo-container img {
            width: 180px;
            height: auto;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1rem;
        }

        input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(13, 116, 136, 0.1);
        }

        button {
            width: 100%;
            padding: 12px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #0b5c6b;
        }

        .error {
            color: #dc2626;
            font-size: 0.85rem;
            margin-top: 15px;
            display: none;
            padding: 10px;
            background: #fef2f2;
            border-radius: 6px;
            border: 1px solid #fecaca;
        }

        .loading {
            opacity: 0.7;
            pointer-events: none;
        }
    </style>
</head>

<body>
    <div class="login-card">
        <div class="logo-container">
            <img src="assets/logo.png" alt="GO & train Logo">
        </div>
        <form id="loginForm">
            <div class="input-group">
                <label for="email">Correo electrónico</label>
                <input type="email" id="email" placeholder="usuario@gogym.com" required autocomplete="email">
            </div>
            <div class="input-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
            </div>
            <button type="submit" id="btnLogin">Iniciar Sesión</button>
        </form>
        <div id="errorMsg" class="error"></div>
    </div>

    <!-- Importamos Firebase desde el nuevo archivo unificado -->
    <script type="module">
        import { auth, db } from './firebase-config.js';
        import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";
        import { doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js";
        import { esRolProyectorSala } from './js/maestros-service.js';

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMsg');
            const btnLogin = document.getElementById('btnLogin');

            errorDiv.style.display = 'none';
            btnLogin.classList.add('loading');
            btnLogin.innerText = 'Verificando...';

            try {
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const userEmail = (userCredential.user.email || email).trim();
                const emailKey = userEmail.toLowerCase();
                const esCuentaInvitadoSala = emailKey === 'invitado@goandtrain.com';

                let userDoc = await getDoc(doc(db, "usuarios_app", emailKey));
                if (!userDoc.exists() && userEmail !== emailKey) {
                    userDoc = await getDoc(doc(db, "usuarios_app", userEmail));
                }

                let rolAsignado = esCuentaInvitadoSala ? 'Proyector Sala' : 'programador';
                let nombreAsignado = esCuentaInvitadoSala ? 'Invitado Sala' : (userEmail ? userEmail.split('@')[0] : 'Empleado');

                if (userDoc.exists()) {
                    const userData = userDoc.data();
                    if (esCuentaInvitadoSala) {
                        rolAsignado = 'Proyector Sala';
                        nombreAsignado = (userData.nombre && userData.nombre !== 'invitado') ? userData.nombre : 'Invitado Sala';
                        try {
                            await setDoc(doc(db, "usuarios_app", emailKey), {
                                email: emailKey,
                                nombre: nombreAsignado,
                                alias: 'Invitado',
                                rol: 'Proyector Sala',
                                es_programador: false
                            }, { merge: true });
                        } catch (e) { }
                    } else {
                        rolAsignado = userData.rol || rolAsignado;
                        nombreAsignado = userData.nombre || userData.alias || nombreAsignado;
                    }
                } else {
                    try {
                        await setDoc(doc(db, "usuarios_app", emailKey), {
                            email: emailKey,
                            nombre: nombreAsignado,
                            alias: esCuentaInvitadoSala ? 'Invitado' : nombreAsignado,
                            rol: rolAsignado,
                            es_programador: !esRolProyectorSala(rolAsignado)
                        }, { merge: true });
                    } catch (e) {
                        console.warn("No se pudo autovincular usuario en usuarios_app:", e);
                    }
                }

                localStorage.setItem('userRole', rolAsignado);
                localStorage.setItem('gym_user_name', nombreAsignado);

                if (esRolProyectorSala(rolAsignado)) {
                    window.location.href = "pantalla_sala.html";
                } else {
                    window.location.href = "planificacion.html";
                }
            } catch (error) {
                auth.signOut();
                errorDiv.innerText = error.message.includes("sin rol") ? error.message : "Credenciales incorrectas.";
                errorDiv.style.display = 'block';
            } finally {
                btnLogin.classList.remove('loading');
                btnLogin.innerText = 'Iniciar Sesión';
            }
        });
    </script>
</body>

</html>
