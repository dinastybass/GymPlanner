<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendientes de programar - GO & train</title>
    <link rel="icon" type="image/png" href="assets/logo.png">

    <link rel="stylesheet" href="styles.css?v=3">
    <script src="nav-component.js" defer></script>

    <style>
        .tabs-selector {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }

        .tab-filter-btn {
            background: #f8fafc;
            color: #475569;
            border: 1px solid var(--border);
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab-filter-btn.active {
            background: var(--accent-dark);
            color: white;
            border-color: var(--accent-dark);
            box-shadow: 0 4px 12px rgba(8, 145, 178, 0.2);
        }

        .trainer-accordion {
            border: 1px solid var(--border);
            border-radius: 10px;
            margin-bottom: 24px;
            overflow: hidden;
            background: var(--surface);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.03);
        }

        .trainer-header {
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            font-weight: 800;
            font-size: 1.02rem;
            background-color: #e0f2fe;
            color: #0369a1;
            border-bottom: 1px solid var(--border);
            transition: background-color 0.15s;
            user-select: none;
        }

        .trainer-header:hover {
            background-color: #bae6fd;
        }

        .trainer-header.sin-asignar {
            background-color: #f1f5f9;
            color: #475569;
        }

        .trainer-header.sin-asignar:hover {
            background-color: #e2e8f0;
        }

        .trainer-body {
            padding: 16px 16px 4px 16px;
            background: #f8fafc;
        }

        .client-accordion {
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-bottom: 14px;
            overflow: hidden;
            background: var(--surface);
        }

        .client-header {
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            background-color: var(--hover-bg);
            border-bottom: 1px solid var(--border);
        }

        .client-header:hover {
            background-color: #e5e7eb;
        }

        table {
            table-layout: fixed;
            width: 100%;
            min-width: 520px;
        }

        th,
        td {
            padding: 12px 20px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        th:nth-child(1),
        td:nth-child(1) {
            width: 24%;
        }

        th:nth-child(2),
        td:nth-child(2) {
            width: 24%;
        }

        th:nth-child(3),
        td:nth-child(3) {
            width: 24%;
        }

        th:nth-child(4),
        td:nth-child(4) {
            width: 28%;
            text-align: right;
        }

        th {
            text-transform: uppercase;
            font-size: 0.75rem;
            background: var(--hover-bg);
        }

        .btn-programar {
            background: var(--accent-dark);
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.8rem;
            text-decoration: none;
            display: inline-block;
        }

        .btn-programar:hover {
            background: #0b5c6b;
        }

        .empty-msg {
            padding: 40px;
            text-align: center;
            color: var(--text-muted);
            font-size: 1.1rem;
        }
    </style>
</head>

<body>
    <gym-navbar active="agenda"></gym-navbar>

    <div class="container">
        <div class="breadcrumb"><a href="agenda.html">Agenda</a> &gt; Programaciones Pendientes</div>
        <div class="page-header" style="margin-bottom: 15px;">
            <h1>Sesiones pendientes de programar</h1>
        </div>

        <div class="tabs-selector">
            <button class="tab-filter-btn active" id="btnTabInd"
                onclick="cambiarVistaPendientes('individuales')">Sesiones individuales</button>
            <button class="tab-filter-btn" id="btnTabSG" onclick="cambiarVistaPendientes('small_groups')">Small
                Groups</button>
        </div>

        <div id="pendientesContainer">
            <p style="color: var(--text-muted);">Analizando agenda...</p>
        </div>
    </div>

    <!-- Script de Firebase unificado -->
    <script type="module">
        import { auth, db } from './firebase-config.js';
        import { collection, query, where, getDocs, updateDoc, writeBatch } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";
        import { getValoresMaestro } from './js/maestros-service.js';
        import { iconChevron as chevronSVG, normalizarTexto, getListaProgramadores } from './js/utils.js';

        let todasLasPendientes = { individuales: [], small_groups: [] };
        let listaProgramadoresOrden = ['Maite', 'Andrés'];
        let vistaActual = 'individuales';

        window.cambiarVistaPendientes = (tipo) => {
            vistaActual = tipo;
            document.getElementById('btnTabInd').className = (tipo === 'individuales') ? 'tab-filter-btn active' : 'tab-filter-btn';
            document.getElementById('btnTabSG').className = (tipo === 'small_groups') ? 'tab-filter-btn active' : 'tab-filter-btn';
            renderizarVistaActual();
        };

        async function loadPendientes() {
            const container = document.getElementById('pendientesContainer');
            try {
                const sgMaster = await getValoresMaestro('Agenda', 'Horarios Small Groups');

                const now = new Date();
                const hoy = new Date(Date.UTC(now.getFullYear(), now.getMonth(), now.getDate(), 0, 0, 0, 0));

                const fechaLimite = new Date(hoy);
                fechaLimite.setUTCDate(fechaLimite.getUTCDate() + 14); // Buscamos a 14 días vista en UTC
                fechaLimite.setUTCHours(23, 59, 59, 999);

                const q = query(collection(db, "agenda_sesiones"), where("fecha_hora_inicio", ">=", hoy), where("fecha_hora_inicio", "<=", fechaLimite));
                const [snapshot, clientesSnap, progsDB] = await Promise.all([
                    getDocs(q),
                    getDocs(collection(db, "clientes")),
                    getListaProgramadores()
                ]);

                if (progsDB && progsDB.length > 0) {
                    listaProgramadoresOrden = progsDB;
                }

                // Mapa de cliente -> Entrenador / Programador asignado
                const progPorId = {};
                const progPorNombre = {};
                const resolverNombreProgramador = (raw) => {
                    const val = String(raw || '').trim();
                    if (!val) return '';
                    const match = listaProgramadoresOrden.find(p => normalizarTexto(p) === normalizarTexto(val));
                    return match || val;
                };

                clientesSnap.forEach(cDoc => {
                    const cData = cDoc.data();
                    const prog = resolverNombreProgramador(cData.Programador || cData.Entrenador || '');
                    if (prog) {
                        progPorId[cDoc.id] = prog;
                        if (cData.ID_Cliente) progPorId[String(cData.ID_Cliente).trim()] = prog;
                        if (cData.Alias) progPorNombre[normalizarTexto(cData.Alias)] = prog;
                        if (cData.Nombre_Cliente) progPorNombre[normalizarTexto(cData.Nombre_Cliente)] = prog;
                    }
                });

                todasLasPendientes = { individuales: [], small_groups: [] };

                const dbSGs = [];
                const indSessions = [];
                const diasSemanaNombres = ["Domingo", "Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado"];

                // LÓGICA DE CORRECCIÓN: Usamos writeBatch para clonar rutinas de SG
                const batch = writeBatch(db);
                let countSGSync = 0;

                snapshot.forEach(doc => {
                    const data = doc.data();
                    if (data.estado === 'Completada') return;

                    let tieneEjercicios = data.ejercicios && Array.isArray(data.ejercicios) && data.ejercicios.length > 0;

                    if (data.tipo_sesion === 'Small Group') {
                        dbSGs.push({ id: doc.id, data, ref: doc.ref, tieneEjercicios });
                    } else {
                        if (!tieneEjercicios) {
                            const d = data.fecha_hora_inicio.toDate();
                            const idCli = String(data.id_cliente || data.ID_Cliente || '').trim();
                            const nombreCli = data.alias || data.nombre_cliente || 'Desconocido';
                            const entrenadorAsignado =
                                (idCli && progPorId[idCli]) ||
                                progPorNombre[normalizarTexto(nombreCli)] ||
                                resolverNombreProgramador(data.programador_asignado || data.Programador) ||
                                'Sin asignar';

                            indSessions.push({
                                id: doc.id,
                                fechaObj: d,
                                fechaStr: d.toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit', year: 'numeric', timeZone: 'UTC' }),
                                diaStr: diasSemanaNombres[d.getUTCDay()],
                                horaStr: d.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit', timeZone: 'UTC' }),
                                cliente: nombreCli,
                                entrenador: entrenadorAsignado
                            });
                        }
                    }
                });

                const sgGroupsByTime = {};
                dbSGs.forEach(sg => {
                    const timeKey = sg.data.fecha_hora_inicio.toMillis();
                    if (!sgGroupsByTime[timeKey]) sgGroupsByTime[timeKey] = [];
                    sgGroupsByTime[timeKey].push(sg);
                });

                const sgPendingList = [];

                for (const timeKey in sgGroupsByTime) {
                    const group = sgGroupsByTime[timeKey];
                    const programmedSession = group.find(s => s.tieneEjercicios);

                    if (programmedSession) {
                        // Sincronización atómica al lote (Batch)
                        const exercisesToCopy = programmedSession.data.ejercicios;
                        for (const session of group) {
                            if (!session.tieneEjercicios) {
                                batch.update(session.ref, { ejercicios: exercisesToCopy });
                                countSGSync++;
                            }
                        }
                    } else {
                        const firstSession = group[0];
                        const d = firstSession.data.fecha_hora_inicio.toDate();
                        sgPendingList.push({
                            id: firstSession.id,
                            fechaObj: d,
                            fechaStr: d.toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit', year: 'numeric', timeZone: 'UTC' }),
                            diaStr: diasSemanaNombres[d.getUTCDay()],
                            horaStr: d.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit', timeZone: 'UTC' })
                        });
                    }
                }

                // Ejecutamos la clonación de golpe en una sola transacción
                if (countSGSync > 0) {
                    await batch.commit().catch(e => console.error("Error sincronizando rutinas de SG:", e));
                }

                todasLasPendientes = {
                    individuales: indSessions,
                    small_groups: sgPendingList
                };

                renderizarVistaActual();
            } catch (error) {
                console.error("Error buscando pendientes:", error);
                container.innerHTML = `<p style="color:red;">Error cargando las sesiones.</p>`;
            }
        }

        function renderizarVistaActual() {
            const container = document.getElementById('pendientesContainer');
            const lista = todasLasPendientes[vistaActual] || [];

            if (lista.length === 0) {
                const tipoTexto = (vistaActual === 'individuales') ? 'individual' : 'de Small Group';
                container.innerHTML = `<div class="empty-msg">🎉 ¡Genial! No hay ninguna sesión ${tipoTexto} pendiente de programación.</div>`;
                return;
            }

            if (vistaActual === 'small_groups') {
                // TABLA DIRECTA PARA SMALL GROUPS (UNA FILA POR HORARIO)
                lista.sort((a, b) => a.fechaObj - b.fechaObj);

                const filas = lista.map(s => `
                    <tr style="border-bottom: 1px solid var(--border); transition: background 0.2s;">
                        <td style="padding:15px 20px;">${s.fechaStr}</td>
                        <td style="padding:15px 20px;">${s.diaStr}</td>
                        <td style="padding:15px 20px; font-weight:bold;">${s.horaStr}</td>
                        <td style="padding:15px 20px; text-align: right;"><a href="programar_sesion.html?id_sesion=${s.id}" class="btn-programar">Programar sesión</a></td>
                    </tr>
                `).join('');

                container.innerHTML = `
                    <div class="table-responsive" style="background:var(--surface); border:1px solid var(--border); border-radius:8px; overflow:hidden;">
                        <table style="width:100%; border-collapse:collapse;">
                            <thead style="background:var(--hover-bg); border-bottom:1px solid var(--border); color:var(--text-muted); font-size:0.75rem;">
                                <tr>
                                    <th style="padding:12px 20px; text-align:left;">FECHA</th>
                                    <th style="padding:12px 20px; text-align:left;">DÍA</th>
                                    <th style="padding:12px 20px; text-align:left;">HORA</th>
                                    <th style="padding:12px 20px; text-align:right;">ACCIÓN</th>
                                </tr>
                            </thead>
                            <tbody style="font-size:0.95rem; color:var(--text-main);">
                                ${filas}
                            </tbody>
                        </table>
                    </div>
                `;
            } else {
                // SECCIONADO PRIMERAMENTE POR ENTRENADOR ASIGNADO Y LUEGO POR CLIENTE
                const porEntrenador = {};
                listaProgramadoresOrden.forEach(p => {
                    porEntrenador[p] = {};
                });

                lista.forEach(s => {
                    const ent = s.entrenador || 'Sin asignar';
                    const cli = s.cliente;
                    if (!porEntrenador[ent]) porEntrenador[ent] = {};
                    if (!porEntrenador[ent][cli]) porEntrenador[ent][cli] = [];
                    porEntrenador[ent][cli].push(s);
                });

                const entrenadoresOrdenados = Object.keys(porEntrenador).sort((a, b) => {
                    if (a === 'Sin asignar') return 1;
                    if (b === 'Sin asignar') return -1;
                    const idxA = listaProgramadoresOrden.indexOf(a);
                    const idxB = listaProgramadoresOrden.indexOf(b);
                    if (idxA !== -1 && idxB !== -1) return idxA - idxB;
                    if (idxA !== -1) return -1;
                    if (idxB !== -1) return 1;
                    return a.localeCompare(b, 'es');
                });

                let html = '';

                entrenadoresOrdenados.forEach(entrenador => {
                    const mapaClientes = porEntrenador[entrenador] || {};
                    const clientesOrdenados = Object.keys(mapaClientes).sort((a, b) => a.localeCompare(b, 'es'));

                    // Si es "Sin asignar" y no tiene sesiones pendientes, no mostrar la sección vacía
                    if (entrenador === 'Sin asignar' && clientesOrdenados.length === 0) return;

                    let totalSesionesEntrenador = 0;
                    clientesOrdenados.forEach(c => { totalSesionesEntrenador += mapaClientes[c].length; });

                    let clientesHTML = '';
                    if (clientesOrdenados.length === 0) {
                        clientesHTML = `
                            <div style="padding: 18px; text-align: center; color: var(--text-muted); font-size: 0.9rem; background: var(--surface); border-radius: 8px; border: 1px dashed var(--border); margin-bottom: 12px;">
                                No hay sesiones individuales pendientes asignadas a <strong>${entrenador}</strong>.
                            </div>
                        `;
                    } else {
                        clientesOrdenados.forEach(clave => {
                            const sesiones = mapaClientes[clave];
                            sesiones.sort((a, b) => a.fechaObj - b.fechaObj);

                            const filas = sesiones.map(s => `
                                <tr>
                                    <td>${s.fechaStr}</td><td>${s.diaStr}</td><td>${s.horaStr}</td>
                                    <td style="text-align: right;"><a href="programar_sesion.html?id_sesion=${s.id}" class="btn-programar">Programar sesión</a></td>
                                </tr>
                            `).join('');

                            clientesHTML += `
                                <div class="client-accordion">
                                    <div class="client-header" onclick="const t = this.nextElementSibling; const s = this.querySelector('svg'); if(t.style.display==='none'){t.style.display='block';s.style.transform='rotate(180deg)';}else{t.style.display='none';s.style.transform='rotate(0deg)';}">
                                        <span>${clave}</span>
                                        <span style="font-weight:normal; font-size:0.85rem; color:var(--text-muted); display:flex; align-items:center; gap:8px;">
                                            <span style="color:#dc2626; font-weight:bold;">${sesiones.length} pendientes</span>
                                            <span class="chevron-icon" style="transform:rotate(180deg);">${chevronSVG}</span>
                                        </span>
                                    </div>
                                    <div class="table-responsive" style="display:block;">
                                        <table>
                                            <thead><tr><th>FECHA</th><th>DÍA</th><th>HORA</th><th style="text-align:right;">ACCIÓN</th></tr></thead>
                                            <tbody>${filas}</tbody>
                                        </table>
                                    </div>
                                </div>
                            `;
                        });
                    }

                    const headerClass = entrenador === 'Sin asignar' ? 'trainer-header sin-asignar' : 'trainer-header';
                    const badgeColor = totalSesionesEntrenador > 0 ? '#dc2626' : 'var(--text-muted)';

                    html += `
                        <div class="trainer-accordion">
                            <div class="${headerClass}" onclick="const t = this.nextElementSibling; const s = this.querySelector('svg'); if(t.style.display==='none'){t.style.display='block';s.style.transform='rotate(180deg)';}else{t.style.display='none';s.style.transform='rotate(0deg)';}">
                                <span>👤 ENTRENADOR: ${entrenador}</span>
                                <span style="font-weight:normal; font-size:0.85rem; display:flex; align-items:center; gap:10px;">
                                    <span>${clientesOrdenados.length} ${clientesOrdenados.length === 1 ? 'cliente' : 'clientes'}</span>
                                    <span>·</span>
                                    <span style="color:${badgeColor}; font-weight:bold;">${totalSesionesEntrenador} pendientes</span>
                                    <span class="chevron-icon" style="transform:rotate(180deg);">${chevronSVG}</span>
                                </span>
                            </div>
                            <div class="trainer-body" style="display:block;">
                                ${clientesHTML}
                            </div>
                        </div>
                    `;
                });

                container.innerHTML = html;
            }
        }

        onAuthStateChanged(auth, (user) => {
            if (user) loadPendientes();
            else window.location.href = "index.html";
        });
    </script>
</body>

</html>
