<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diseñar Plantilla - GO & train</title>
    <link rel="icon" type="image/png" href="assets/logo.png">

    <link rel="stylesheet" href="styles.css?v=3">
    <script src="nav-component.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>

    <style>
        .page-header {
            align-items: flex-end;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 20px;
        }

        .page-header h1 {
            font-size: 1.8rem;
            margin: 0 0 5px 0;
        }
    </style>
</head>

<body>
    <gym-navbar active="plantillas"></gym-navbar>

    <div class="container">
        <div class="breadcrumb"><a href="plantillas.html">Plantillas</a> &gt; Diseñador</div>
        <div class="page-header">
            <div>
                <h1 id="ui-plantilla-name">Cargando plantilla...</h1>
                <div class="header-meta" id="ui-plantilla-meta">...</div>
            </div>
            <button class="btn-primary" onclick="abrirModal()">+ Añadir ejercicio</button>
        </div>

        <div class="session-preview" id="previewContainer"></div>
    </div>

    <!-- MODAL AÑADIR/EDITAR EJERCICIO -->
    <div class="modal-overlay" id="modalAdd">
        <div class="modal-content">
            <button class="modal-close" onclick="cerrarModal()">&times;</button>
            <h2 id="modal-main-title" style="margin-top:0;">Añadir a plantilla</h2>
            <form id="formAddEx">
                <div class="form-grid">
                    <div class="form-group full">
                        <label>Ejercicio del catálogo *</label>
                        <div class="custom-dropdown" id="dropdownEjercicio">
                            <div class="dropdown-trigger" onclick="toggleDropdown('panelEjercicio', 'm_search')">
                                <span id="triggerTextEjercicio">Selecciona un ejercicio...</span>
                                <span class="chevron-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                                        stroke="currentColor" stroke-width="2.5">
                                        <polyline points="6 9 12 15 18 9"></polyline>
                                    </svg></span>
                            </div>
                            <div class="dropdown-panel" id="panelEjercicio">
                                <div class="dropdown-search-container">
                                    <input type="text" id="m_search" placeholder="Buscar por nombre o acrónimo..."
                                        oninput="filtrarDropdownEjercicios()">
                                </div>
                                <div class="dropdown-options" id="optionsEjercicio"></div>
                            </div>
                            <input type="hidden" id="m_ejercicio_select">
                        </div>
                    </div>
                    <div class="form-group"><label>Bloque filtro</label><select id="m_filter_bloque">
                            <option value="">Todos</option>
                        </select></div>
                    <div class="form-group"><label>Nivel filtro</label><select id="m_filter_nivel">
                            <option value="">Todos</option>
                        </select></div>

                    <div class="form-group full"><label>Detalle</label><input type="text" id="m_detalle"></div>
                    <div class="form-group full"><label>Alias</label><input type="text" id="m_alias" readonly
                            style="background:#e5e7eb;"></div>

                    <!-- Material Adaptación MULTISELECCIÓN -->
                    <div class="form-group full">
                        <label>Material Adaptación (Opc.)</label>
                        <div class="custom-dropdown">
                            <div class="dropdown-trigger" onclick="toggleDropdown('panelMaterial')">
                                <span id="triggerTextMaterial">Selecciona opciones</span>
                                <span class="chevron-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                                        stroke="currentColor" stroke-width="2.5">
                                        <polyline points="6 9 12 15 18 9"></polyline>
                                    </svg></span>
                            </div>
                            <div class="dropdown-panel" id="panelMaterial">
                                <div class="dropdown-search-container"><input type="text" id="searchMaterial"
                                        placeholder="Buscar opción..."
                                        onkeyup="filterDropdown('Material', this.value, true)"></div>
                                <div class="dropdown-options" id="optionsMaterial"></div>
                                <div class="dropdown-actions">
                                    <button type="button" class="btn-limpiar"
                                        onclick="clearDropdown('Material')">Limpiar</button>
                                    <button type="button" class="btn-listo"
                                        onclick="closeDropdown('panelMaterial')">Listo</button>
                                </div>
                            </div>
                            <input type="hidden" id="m_material_adaptacion">
                        </div>
                    </div>

                    <div class="form-group full"><label>Bloque de Sesión *</label><select id="m_bloque_sesion"
                            required></select></div>

                    <!-- SECCIÓN SUBGRUPOS / COMBINADOS (OPCIONAL) -->
                    <div class="form-group full"
                        style="background: #f8fafc; border: 1px solid var(--border); border-left: 4px solid var(--accent-dark); border-radius: 8px; padding: 14px; margin-bottom: 5px;">
                        <div
                            style="font-weight: bold; color: var(--accent-dark); font-size: 0.95rem; margin-bottom: 10px; display: flex; align-items: center; gap: 6px;">
                            <span>🔄</span> Subgrupo / Combinado / Circuito (Opcional)
                        </div>
                        <div class="form-grid" style="margin-bottom: 0;">
                            <div class="form-group">
                                <label>Asignar a Subgrupo</label>
                                <select id="m_subgrupo_select" onchange="onSubgrupoSelectChange()">
                                    <option value="">Ninguno (Ejercicio individual)</option>
                                    <option value="__nuevo__">+ Crear nuevo subgrupo...</option>
                                </select>
                                <input type="text" id="m_subgrupo_custom"
                                    placeholder="Nombre (ej: Tabata, Circuito 1, Superserie A)"
                                    style="display: none; margin-top: 8px; padding: 9px; border: 1px solid var(--border); border-radius: 6px;">
                            </div>
                            <div class="form-group">
                                <label>Pauta / Repeticiones del Subgrupo</label>
                                <input type="text" id="m_subgrupo_detalle"
                                    placeholder="Ej: Repetir circuito 2 veces | 20'' ON / 10'' OFF | 3 vueltas" disabled
                                    style="background: #f1f5f9; padding: 9px; border: 1px solid var(--border); border-radius: 6px;">
                            </div>
                        </div>
                    </div>

                    <!-- SERIES Y REPETICIONES DEL EJERCICIO (DESPLEGABLE MAESTRO + TEXTO LIBRE) -->
                    <div class="form-group">
                        <label>Series/Reps *</label>
                        <select id="m_reps" required></select>
                        <input type="text" id="m_reps_custom" placeholder="Ej: 50 reps, 20 seg..."
                            style="display: none; margin-top: 8px; padding: 9px; border: 1px solid var(--border); border-radius: 6px;">
                    </div>
                    <div class="form-group"><label>Peso</label><input type="text" id="m_peso"></div>
                    <div class="form-group full"><label>Intensidad</label>
                        <select id="m_intensidad">
                            <option value="LOW">LOW</option>
                            <option value="MED" selected>MED</option>
                            <option value="HIGH">HIGH</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-secondary" onclick="cerrarModal()">Cancelar</button>
                    <button type="submit" class="btn-primary">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module">
        import { auth, db } from './firebase-config.js';
        import { doc, getDoc, setDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";
        import { poblarSelect, getValoresMaestro, getMapaOrdenMaestro } from './js/maestros-service.js';
        import { normalizarTexto, iconTrash } from './js/utils.js';
        import { crearHistorialUndo } from './js/undo-service.js';

        const urlParams = new URLSearchParams(window.location.search);
        const idPlantilla = urlParams.get('id');
        if (!idPlantilla) window.location.href = "plantillas.html";

        let plantillaData = {};
        let catalogoEjercicios = [];
        let ejerciciosSesion = [];
        let editingIndex = -1;
        let ordenBloques = {};
        let materialesMaestro = [];
        let seriePorDefecto = "3 x 10";
        let sortableInstance = null;

        const undoHistory = crearHistorialUndo({
            contextKey: `editar_plantilla_${idPlantilla}`,
            maxSteps: 10,
            containerId: 'undoToolbarContainer',
            onAfterApply: async () => {
                const docSnap = await getDoc(doc(db, "plantillas_sesiones", idPlantilla));
                if (docSnap.exists()) {
                    plantillaData = docSnap.data();
                    ejerciciosSesion = plantillaData.ejercicios || [];
                    renderSesionActual();
                }
            }
        });

        // --- Manejo del Dropdown Customizado de Material ---
        function buildDropdownOptions(idRef, list, isMulti) {
            const container = document.getElementById(`options${idRef}`);
            if (!container) return;
            container.innerHTML = list.map(item => {
                if (isMulti) {
                    return `<label class="dropdown-option"><input type="checkbox" value="${item}" onchange="updateMultiSelection('${idRef}')"> <span>${item}</span></label>`;
                } else {
                    return `<div class="dropdown-option" onclick="selectSingleOption('${idRef}', '${item}')"><span>${item}</span></div>`;
                }
            }).join('');
        }

        window.toggleDropdown = (panelId, searchInputId) => {
            document.querySelectorAll('.dropdown-panel.active').forEach(p => { if (p.id !== panelId) p.classList.remove('active'); });
            const panel = document.getElementById(panelId);
            if (!panel) return;
            panel.classList.toggle('active');
            if (panel.classList.contains('active') && searchInputId) {
                const inp = document.getElementById(searchInputId);
                if (inp) setTimeout(() => inp.focus(), 40);
            }
        };

        window.closeDropdown = (panelId) => { document.getElementById(panelId)?.classList.remove('active'); };

        window.seleccionarEjercicioDropdown = (idDoc) => {
            const ej = catalogoEjercicios.find(x => x.id_doc === idDoc);
            const hiddenInput = document.getElementById('m_ejercicio_select');
            const triggerText = document.getElementById('triggerTextEjercicio');
            if (hiddenInput) hiddenInput.value = idDoc || '';
            if (triggerText) {
                if (ej) {
                    const acroText = (ej['Acrónimo'] || ej.Acronimo) ? `[${ej['Acrónimo'] || ej.Acronimo}] ` : '';
                    triggerText.innerText = `${acroText}${ej.Nombre_Ejercicio}`;
                } else {
                    triggerText.innerText = 'Selecciona un ejercicio...';
                }
            }
            closeDropdown('panelEjercicio');
            if (hiddenInput) hiddenInput.dispatchEvent(new Event('change'));
        };

        window.selectSingleOption = (idRef, val) => {
            document.getElementById(`m_${idRef.toLowerCase()}`).value = val;
            document.getElementById(`triggerText${idRef}`).innerText = val;
            closeDropdown(`panel${idRef}`);
        };

        window.updateMultiSelection = (idRef) => {
            const checks = document.querySelectorAll(`#options${idRef} input[type="checkbox"]:checked`);
            const vals = Array.from(checks).map(c => c.value);
            document.getElementById(`m_${idRef.toLowerCase()}_adaptacion`).value = vals.join(', ');
            document.getElementById(`triggerText${idRef}`).innerText = vals.length > 0 ? `${vals.length} seleccionado(s)` : 'Selecciona opciones';
        };

        window.clearDropdown = (idRef) => {
            document.querySelectorAll(`#options${idRef} input[type="checkbox"]`).forEach(c => c.checked = false);
            document.getElementById(`m_${idRef.toLowerCase()}_adaptacion`).value = '';
            document.getElementById(`triggerText${idRef}`).innerText = 'Selecciona opciones';
        };

        window.filterDropdown = (idRef, searchRaw, isMulti) => {
            const searchTxt = normalizarTexto(searchRaw);
            const container = document.getElementById(`options${idRef}`);
            if (!container) return;
            const items = isMulti ? container.querySelectorAll('label') : container.querySelectorAll('.dropdown-option');
            items.forEach(el => {
                const txt = normalizarTexto(el.innerText);
                el.style.display = txt.includes(searchTxt) ? 'flex' : 'none';
            });
        };

        function setDropdownValues(idRef, commaString) {
            if (!commaString) { clearDropdown(idRef); return; }
            const valsNorm = commaString.split(',').map(s => normalizarTexto(s.trim())).filter(Boolean);
            const checks = document.querySelectorAll(`#options${idRef} input[type="checkbox"]`);
            if (checks.length > 0) {
                checks.forEach(c => {
                    c.checked = valsNorm.includes(normalizarTexto(c.value.trim()));
                });
                updateMultiSelection(idRef);
            } else {
                const firstVal = commaString.split(',')[0].trim();
                if (firstVal) selectSingleOption(idRef, firstVal);
            }
        }

        function cargarOpcionesMaterial(materialesCatalogoStr = '', materialesSeleccionadosStr = '') {
            const catMats = materialesCatalogoStr
                ? materialesCatalogoStr.split(',').map(s => s.trim()).filter(Boolean)
                : [];
            const selMats = materialesSeleccionadosStr
                ? materialesSeleccionadosStr.split(',').map(s => s.trim()).filter(Boolean)
                : [];

            const listaOrdenada = [];
            const vistos = new Set();

            const agregar = (item) => {
                const clean = String(item || '').trim();
                const norm = normalizarTexto(clean);
                if (norm && !vistos.has(norm)) {
                    vistos.add(norm);
                    listaOrdenada.push(clean);
                }
            };

            catMats.forEach(agregar);
            materialesMaestro.forEach(agregar);
            selMats.forEach(agregar);

            const searchInp = document.getElementById('searchMaterial');
            if (searchInp) searchInp.value = '';

            buildDropdownOptions('Material', listaOrdenada, true);
            if (materialesSeleccionadosStr) {
                setDropdownValues('Material', materialesSeleccionadosStr);
            } else {
                clearDropdown('Material');
            }
        }

        // --- Manejo dinámico de Subgrupos en el Modal ---
        function actualizarComboSubgrupos(selectedVal = '') {
            const select = document.getElementById('m_subgrupo_select');
            if (!select) return;

            const subgruposMap = {};
            ejerciciosSesion.forEach(e => {
                const s = (e.Subgrupo || e.subgrupo || '').trim();
                const d = (e.Subgrupo_Detalle || e.subgrupo_detalle || '').trim();
                if (s && !subgruposMap[s]) {
                    subgruposMap[s] = d;
                }
            });

            select.innerHTML = `
        <option value="">Ninguno (Ejercicio individual)</option>
        <option value="__nuevo__">+ Crear nuevo subgrupo...</option>
      `;

            Object.keys(subgruposMap).sort().forEach(sub => {
                const opt = document.createElement('option');
                opt.value = sub;
                opt.textContent = `Subgrupo: ${sub}`;
                select.appendChild(opt);
            });

            if (selectedVal && selectedVal !== '__nuevo__') {
                if (!subgruposMap[selectedVal]) {
                    const opt = document.createElement('option');
                    opt.value = selectedVal;
                    opt.textContent = `Subgrupo: ${selectedVal}`;
                    select.appendChild(opt);
                }
                select.value = selectedVal;
            } else {
                select.value = selectedVal;
            }
        }

        window.onSubgrupoSelectChange = () => {
            const sel = document.getElementById('m_subgrupo_select').value;
            const customInp = document.getElementById('m_subgrupo_custom');
            const detalleInp = document.getElementById('m_subgrupo_detalle');

            if (sel === '__nuevo__') {
                customInp.style.display = 'block';
                customInp.value = '';
                customInp.focus();
                detalleInp.disabled = false;
                detalleInp.style.background = '#ffffff';
                detalleInp.value = '';
            } else if (sel === '') {
                customInp.style.display = 'none';
                customInp.value = '';
                detalleInp.disabled = true;
                detalleInp.style.background = '#f1f5f9';
                detalleInp.value = '';
            } else {
                customInp.style.display = 'none';
                customInp.value = '';
                detalleInp.disabled = false;
                detalleInp.style.background = '#ffffff';

                const ejConSub = ejerciciosSesion.find(e => (e.Subgrupo || e.subgrupo) === sel);
                detalleInp.value = ejConSub ? (ejConSub.Subgrupo_Detalle || ejConSub.subgrupo_detalle || '') : '';
            }
        };

        window.abrirModalConSubgrupo = (bloque, subgrupo, detalle) => {
            window.abrirModal();
            if (bloque && document.querySelector(`#m_bloque_sesion option[value="${bloque}"]`)) {
                document.getElementById('m_bloque_sesion').value = bloque;
            }
            actualizarComboSubgrupos(subgrupo);
            const customInp = document.getElementById('m_subgrupo_custom');
            const detalleInp = document.getElementById('m_subgrupo_detalle');
            customInp.style.display = 'none';
            customInp.value = '';
            detalleInp.disabled = false;
            detalleInp.style.background = '#ffffff';
            detalleInp.value = detalle || '';
        };

        async function init() {
            ordenBloques = await getMapaOrdenMaestro('Ejercicios', 'Bloques');
            await Promise.all([
                poblarSelect('m_filter_bloque', 'Ejercicios', 'Bloques', 'Todos'),
                poblarSelect('m_filter_nivel', 'Ejercicios', 'Niveles', 'Todos'),
                poblarSelect('m_bloque_sesion', 'Ejercicios', 'Bloques', null),
                poblarSelect('m_reps', 'Ejercicios', 'Series y Repeticiones', null)
            ]);

            const selectReps = document.getElementById('m_reps');
            const optCustom = document.createElement('option');
            optCustom.value = '__custom__';
            optCustom.textContent = '✏️ Texto libre (ej: 50 reps, 20")...';
            selectReps.appendChild(optCustom);

            selectReps.addEventListener('change', (e) => {
                const customInput = document.getElementById('m_reps_custom');
                if (e.target.value === '__custom__') {
                    customInput.style.display = 'block';
                    customInput.focus();
                } else {
                    customInput.style.display = 'none';
                    customInput.value = '';
                }
            });

            const [seriesMaestro, matMaestro] = await Promise.all([
                getValoresMaestro('Ejercicios', 'Series y Repeticiones'),
                getValoresMaestro('Ejercicios', 'Materiales')
            ]);
            if (seriesMaestro.length > 0) seriePorDefecto = seriesMaestro[0];
            materialesMaestro = matMaestro || [];

            const docSnap = await getDoc(doc(db, "plantillas_sesiones", idPlantilla));
            if (docSnap.exists()) {
                plantillaData = docSnap.data();
                ejerciciosSesion = plantillaData.ejercicios || [];

                if (!plantillaData.orden_customizado && ejerciciosSesion.length > 0) {
                    ejerciciosSesion.sort((a, b) => {
                        const bA = a.Bloque || a.Fase_Bloque || 'General';
                        const bB = b.Bloque || b.Fase_Bloque || 'General';
                        return (ordenBloques[bA] || 99) - (ordenBloques[bB] || 99);
                    });
                    await setDoc(doc(db, "plantillas_sesiones", idPlantilla), { orden_customizado: true, ejercicios: ejerciciosSesion }, { merge: true });
                }

                document.getElementById('ui-plantilla-name').innerText = plantillaData.nombre;
                const tipoTxt = plantillaData.tipo_sesion ? `Tipo de Sesión: ${plantillaData.tipo_sesion} · ` : '';
                document.getElementById('ui-plantilla-meta').innerText = `${tipoTxt}Nivel Objetivo: ${plantillaData.nivel || '-'}`;
                renderSesionActual();
                initSortable();
            }

            const catSnap = await getDocs(collection(db, "ejercicios"));
            catSnap.forEach(doc => catalogoEjercicios.push({ id_doc: doc.id, ...doc.data() }));
            filtrarDropdownEjercicios();

            document.addEventListener('click', (e) => {
                if (!e.target.closest('.custom-dropdown')) {
                    document.querySelectorAll('.dropdown-panel').forEach(p => p.classList.remove('active'));
                }
            });
        }

        function initSortable() {
            const container = document.getElementById('previewContainer');
            if (!container) return;
            sortableInstance = new Sortable(container, {
                animation: 150,
                handle: '.drag-handle',
                filter: '.ignore-drag, .empty-preview',
                onEnd: async function () {
                    const exItems = Array.from(container.querySelectorAll('.ex-item'));
                    if (exItems.length === 0) return;

                    const newOrderIndices = exItems.map(el => parseInt(el.getAttribute('data-index')));
                    const huboCambio = newOrderIndices.some((val, i) => val !== i);
                    if (!huboCambio) return;

                    const prevEjercicios = JSON.parse(JSON.stringify(ejerciciosSesion));
                    ejerciciosSesion = newOrderIndices.map(idx => ejerciciosSesion[idx]);
                    const nextEjercicios = JSON.parse(JSON.stringify(ejerciciosSesion));

                    renderSesionActual();
                    await setDoc(doc(db, "plantillas_sesiones", idPlantilla), { ejercicios: ejerciciosSesion }, { merge: true });

                    undoHistory.pushAction({
                        label: "Reordenar ejercicios",
                        undoOps: [{ type: 'set', collection: 'plantillas_sesiones', id: idPlantilla, data: { ejercicios: prevEjercicios }, merge: true }],
                        redoOps: [{ type: 'set', collection: 'plantillas_sesiones', id: idPlantilla, data: { ejercicios: nextEjercicios }, merge: true }]
                    });
                }
            });
        }

        function renderSesionActual() {
            const container = document.getElementById('previewContainer');
            if (!container) return;
            if (ejerciciosSesion.length === 0) {
                container.innerHTML = `<div class="empty-preview ignore-drag">Plantilla vacía.</div>`;
                return;
            }

            let html = '';
            let currentBlock = null;
            let currentSubgrupo = null;

            ejerciciosSesion.forEach((ej, index) => {
                const bName = ej.Bloque || ej.Fase_Bloque || 'General';
                const subName = (ej.Subgrupo || ej.subgrupo || '').trim();
                const subDetalle = (ej.Subgrupo_Detalle || ej.subgrupo_detalle || '').trim();

                if (bName !== currentBlock) {
                    html += `<div class="block-title ignore-drag">${bName}</div>`;
                    currentBlock = bName;
                    currentSubgrupo = null;
                }

                if (subName !== currentSubgrupo) {
                    if (subName) {
                        const pautaText = subDetalle ? `<span class="subgroup-pauta">${subDetalle}</span>` : '';
                        const bEscaped = bName.replace(/'/g, "\\'");
                        const sEscaped = subName.replace(/'/g, "\\'");
                        const dEscaped = subDetalle.replace(/'/g, "\\'");

                        html += `
              <div class="subgroup-header ignore-drag">
                <div class="subgroup-title-box">
                  <span class="subgroup-badge">🔄 SUBGRUPO / CIRCUITO</span>
                  <span class="subgroup-name">${subName}</span>
                  ${pautaText}
                </div>
                <button type="button" class="btn-add-subgroup-ex" onclick="event.stopPropagation(); abrirModalConSubgrupo('${bEscaped}', '${sEscaped}', '${dEscaped}')" title="Añadir a ${subName}">+ Añadir a este subgrupo</button>
              </div>
            `;
                    }
                    currentSubgrupo = subName;
                }

                const n = ej.Nombre_Ejercicio || 'Sin nombre';
                const acro = ej.Acrónimo || ej.Acronimo || '';
                const r = ej.Series || ej.Volumen_Series_Reps || '-';
                const itemClass = subName ? 'ex-item in-subgroup' : 'ex-item';

                let extraInfo = [];
                if (ej.Detalle) extraInfo.push(ej.Detalle);
                if (ej.Material_Adaptacion) extraInfo.push(`Mat: ${ej.Material_Adaptacion}`);
                const extras = extraInfo.join(' | ');
                const desc = extras ? `<div class="ex-item-detail">${extras}</div>` : '';

                html += `
          <div class="${itemClass}" data-index="${index}" onclick="abrirModalEditar(${index})">
            <div class="drag-handle" title="Arrastra para reordenar">⋮⋮</div>
            <div class="ex-item-info"><span class="ex-item-title">${acro ? acro + ' · ' : ''}${n}</span>${desc}</div>
            <div style="display:flex; gap:15px; align-items:center;">
              <span class="ex-item-presc">${r}</span>
              <button class="btn-icon danger" onclick="event.stopPropagation(); borrarEx(${index})" title="Quitar de la plantilla">${iconTrash}</button>
            </div>
          </div>
        `;
            });
            container.innerHTML = html;
        }

        document.addEventListener('DOMContentLoaded', () => {
            const mSearch = document.getElementById('m_search');
            const filterBloque = document.getElementById('m_filter_bloque');
            const filterNivel = document.getElementById('m_filter_nivel');
            const selectEj = document.getElementById('m_ejercicio_select');
            const formAddEx = document.getElementById('formAddEx');

            if (mSearch) mSearch.addEventListener('input', filtrarDropdownEjercicios);
            if (filterBloque) filterBloque.addEventListener('change', filtrarDropdownEjercicios);
            if (filterNivel) filterNivel.addEventListener('change', filtrarDropdownEjercicios);

            if (selectEj) {
                selectEj.addEventListener('change', (e) => {
                    const idSelected = e.target.value;
                    if (!idSelected) {
                        document.getElementById('m_alias').value = '';
                        cargarOpcionesMaterial('', '');
                        return;
                    }
                    const ej = catalogoEjercicios.find(x => x.id_doc === idSelected);
                    if (ej) {
                        document.getElementById('m_alias').value = ej['Acrónimo'] || ej.Acronimo || '';
                        if (ej.Bloque && document.querySelector(`#m_bloque_sesion option[value="${ej.Bloque}"]`)) {
                            document.getElementById('m_bloque_sesion').value = ej.Bloque;
                        }
                        const catMat = ej.Material || '';
                        cargarOpcionesMaterial(catMat, catMat);
                    }
                });
            }

            if (formAddEx) {
                formAddEx.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const prevEjercicios = JSON.parse(JSON.stringify(ejerciciosSesion));
                    const wasEditing = editingIndex >= 0;
                    const idCat = document.getElementById('m_ejercicio_select').value;
                    const ejCat = catalogoEjercicios.find(x => x.id_doc === idCat);
                    if (!idCat || !ejCat) {
                        alert("Por favor, selecciona un ejercicio del catálogo.");
                        return;
                    }

                    let subName = document.getElementById('m_subgrupo_select').value;
                    if (subName === '__nuevo__') {
                        subName = document.getElementById('m_subgrupo_custom').value.trim();
                    }
                    let subDetalle = '';
                    if (subName) {
                        subDetalle = document.getElementById('m_subgrupo_detalle').value.trim();
                        if (subDetalle) {
                            ejerciciosSesion.forEach(ejItem => {
                                if ((ejItem.Subgrupo || ejItem.subgrupo) === subName) {
                                    ejItem.Subgrupo_Detalle = subDetalle;
                                }
                            });
                        }
                    }

                    let repsVal = document.getElementById('m_reps').value;
                    if (repsVal === '__custom__') {
                        repsVal = document.getElementById('m_reps_custom').value.trim() || '-';
                    }

                    const itemData = {
                        ID_Ejercicio: ejCat.id_doc,
                        Nombre_Ejercicio: ejCat.Nombre_Ejercicio,
                        Acrónimo: document.getElementById('m_alias').value,
                        Detalle: document.getElementById('m_detalle').value,
                        Bloque: document.getElementById('m_bloque_sesion').value,
                        Series: repsVal,
                        Peso: document.getElementById('m_peso').value,
                        Intensidad: document.getElementById('m_intensidad').value,
                        Material: ejCat.Material || '',
                        Material_Adaptacion: document.getElementById('m_material_adaptacion').value.trim(),
                        Subgrupo: subName,
                        Subgrupo_Detalle: subDetalle
                    };

                    if (editingIndex >= 0) {
                        ejerciciosSesion[editingIndex] = itemData;
                    } else {
                        let insertIndex = -1;
                        if (itemData.Subgrupo) {
                            for (let i = ejerciciosSesion.length - 1; i >= 0; i--) {
                                const eOld = ejerciciosSesion[i];
                                if ((eOld.Bloque || '') === itemData.Bloque && (eOld.Subgrupo || '') === itemData.Subgrupo) {
                                    insertIndex = i + 1;
                                    break;
                                }
                            }
                        }

                        if (insertIndex === -1) {
                            for (let i = ejerciciosSesion.length - 1; i >= 0; i--) {
                                if ((ejerciciosSesion[i].Bloque || '') === itemData.Bloque) {
                                    insertIndex = i + 1;
                                    break;
                                }
                            }
                        }

                        if (insertIndex !== -1) ejerciciosSesion.splice(insertIndex, 0, itemData);
                        else ejerciciosSesion.push(itemData);
                    }

                    const nextEjercicios = JSON.parse(JSON.stringify(ejerciciosSesion));
                    await setDoc(doc(db, "plantillas_sesiones", idPlantilla), { ejercicios: ejerciciosSesion, orden_customizado: true }, { merge: true });
                    renderSesionActual();
                    cerrarModal();

                    undoHistory.pushAction({
                        label: `${wasEditing ? 'Editar' : 'Añadir'} "${itemData.Acrónimo || itemData.Nombre_Ejercicio}"`,
                        undoOps: [{ type: 'set', collection: 'plantillas_sesiones', id: idPlantilla, data: { ejercicios: prevEjercicios, orden_customizado: true }, merge: true }],
                        redoOps: [{ type: 'set', collection: 'plantillas_sesiones', id: idPlantilla, data: { ejercicios: nextEjercicios, orden_customizado: true }, merge: true }]
                    });
                });
            }
        });

        window.abrirModal = () => {
            editingIndex = -1;
            document.getElementById('formAddEx').reset();
            document.getElementById('m_ejercicio_select').value = '';
            document.getElementById('triggerTextEjercicio').innerText = 'Selecciona un ejercicio...';
            closeDropdown('panelEjercicio');
            document.getElementById('m_reps').value = seriePorDefecto;
            document.getElementById('m_reps_custom').style.display = 'none';
            document.getElementById('m_reps_custom').value = '';
            cargarOpcionesMaterial('', '');
            actualizarComboSubgrupos('');
            window.onSubgrupoSelectChange();
            filtrarDropdownEjercicios();
            document.getElementById('modalAdd').style.display = 'flex';
        };

        window.abrirModalEditar = (idx) => {
            editingIndex = idx;
            const ej = ejerciciosSesion[idx];
            document.getElementById('m_search').value = '';
            document.getElementById('m_filter_bloque').value = '';
            document.getElementById('m_filter_nivel').value = '';
            filtrarDropdownEjercicios();
            document.getElementById('m_alias').value = ej.Acrónimo || '';
            document.getElementById('m_detalle').value = ej.Detalle || '';

            const targetName = ej.Nombre_Ejercicio || '';
            const ejCatObj = catalogoEjercicios.find(x => x.id_doc === ej.ID_Ejercicio || x.ID_Ejercicio === ej.ID_Ejercicio || x.Nombre_Ejercicio === targetName);
            const foundValue = ejCatObj ? ejCatObj.id_doc : (ej.ID_Ejercicio || '');
            const acroText = (ejCatObj && (ejCatObj['Acrónimo'] || ejCatObj.Acronimo)) ? `[${ejCatObj['Acrónimo'] || ejCatObj.Acronimo}] ` : '';
            const foundLabel = ejCatObj ? `${acroText}${ejCatObj.Nombre_Ejercicio}` : (targetName || 'Selecciona un ejercicio...');
            document.getElementById('m_ejercicio_select').value = foundValue;
            document.getElementById('triggerTextEjercicio').innerText = foundLabel;
            closeDropdown('panelEjercicio');
            const catMat = ejCatObj ? (ejCatObj.Material || '') : (ej.Material || '');
            const savedMat = ej.Material_Adaptacion !== undefined ? ej.Material_Adaptacion : (ej.Material || '');
            cargarOpcionesMaterial(catMat, savedMat);
            if (ej.Bloque && document.querySelector(`#m_bloque_sesion option[value="${ej.Bloque}"]`)) {
                document.getElementById('m_bloque_sesion').value = ej.Bloque;
            }

            // Cargar Subgrupo
            const sName = (ej.Subgrupo || ej.subgrupo || '').trim();
            const sDetalle = (ej.Subgrupo_Detalle || ej.subgrupo_detalle || '').trim();
            actualizarComboSubgrupos(sName);
            const customInp = document.getElementById('m_subgrupo_custom');
            const detalleInp = document.getElementById('m_subgrupo_detalle');
            if (sName) {
                document.getElementById('m_subgrupo_select').value = sName;
                customInp.style.display = 'none';
                customInp.value = '';
                detalleInp.disabled = false;
                detalleInp.style.background = '#ffffff';
                detalleInp.value = sDetalle;
            } else {
                document.getElementById('m_subgrupo_select').value = '';
                customInp.style.display = 'none';
                customInp.value = '';
                detalleInp.disabled = true;
                detalleInp.style.background = '#f1f5f9';
                detalleInp.value = '';
            }

            const selectReps = document.getElementById('m_reps');
            const customReps = document.getElementById('m_reps_custom');
            const repsVal = ej.Series || ej.Volumen_Series_Reps || '';
            if (repsVal && selectReps.querySelector(`option[value="${repsVal}"]`)) {
                selectReps.value = repsVal;
                customReps.style.display = 'none';
                customReps.value = '';
            } else if (repsVal) {
                selectReps.value = '__custom__';
                customReps.style.display = 'block';
                customReps.value = repsVal;
            } else {
                selectReps.value = seriePorDefecto;
                customReps.style.display = 'none';
                customReps.value = '';
            }

            document.getElementById('m_peso').value = ej.Peso || '';
            document.getElementById('m_intensidad').value = ej.Intensidad || 'MED';
            document.getElementById('modalAdd').style.display = 'flex';
        };

        window.cerrarModal = () => document.getElementById('modalAdd').style.display = 'none';

        function filtrarDropdownEjercicios() {
            const searchEl = document.getElementById('m_search');
            if (!searchEl) return;
            const rawTxt = searchEl.value;
            const txtBusqueda = normalizarTexto(rawTxt);
            const fB = document.getElementById('m_filter_bloque').value;
            const fN = document.getElementById('m_filter_nivel').value;
            const optionsContainer = document.getElementById('optionsEjercicio');
            if (!optionsContainer) return;

            const filtrados = catalogoEjercicios.filter(e => {
                const nameNormalizado = normalizarTexto(e.Nombre_Ejercicio);
                const acroNormalizado = normalizarTexto(e['Acrónimo'] || e.Acronimo);

                if (txtBusqueda && !nameNormalizado.includes(txtBusqueda) && !acroNormalizado.includes(txtBusqueda)) return false;
                if (fB && e.Bloque !== fB) return false;
                if (fN && e.Nivel_Dificultad !== fN) return false;
                return true;
            }).sort((a, b) => (a.Nombre_Ejercicio || '').localeCompare(b.Nombre_Ejercicio || ''));

            if (filtrados.length === 0) {
                optionsContainer.innerHTML = `<div class="dropdown-option" style="color: var(--text-muted); cursor: default;"><span>Sin ejercicios coincidentes</span></div>`;
            } else {
                optionsContainer.innerHTML = filtrados.map(e => {
                    const acroText = (e['Acrónimo'] || e.Acronimo) ? `[${e['Acrónimo'] || e.Acronimo}] ` : '';
                    return `<div class="dropdown-option" onclick="window.seleccionarEjercicioDropdown('${e.id_doc}')"><span>${acroText}${e.Nombre_Ejercicio}</span></div>`;
                }).join('');
            }
        }
        window.filtrarDropdownEjercicios = filtrarDropdownEjercicios;

        window.borrarEx = async (idx) => {
            if (confirm("¿Quitar de la plantilla?")) {
                const prevEjercicios = JSON.parse(JSON.stringify(ejerciciosSesion));
                const ejBorrado = ejerciciosSesion[idx];
                const nombreEj = ejBorrado ? (ejBorrado.Acrónimo || ejBorrado.Nombre_Ejercicio || 'Ejercicio') : 'Ejercicio';

                ejerciciosSesion.splice(idx, 1);
                const nextEjercicios = JSON.parse(JSON.stringify(ejerciciosSesion));

                await setDoc(doc(db, "plantillas_sesiones", idPlantilla), { ejercicios: ejerciciosSesion }, { merge: true });
                renderSesionActual();

                undoHistory.pushAction({
                    label: `Quitar "${nombreEj}"`,
                    undoOps: [{ type: 'set', collection: 'plantillas_sesiones', id: idPlantilla, data: { ejercicios: prevEjercicios }, merge: true }],
                    redoOps: [{ type: 'set', collection: 'plantillas_sesiones', id: idPlantilla, data: { ejercicios: nextEjercicios }, merge: true }],
                    showToast: true,
                    toastMessage: `🗑️ "${nombreEj}" quitado de la plantilla`
                });
            }
        };

        onAuthStateChanged(auth, (user) => {
            if (user) init();
            else window.location.href = "index.html";
        });
    </script>
</body>

</html>
