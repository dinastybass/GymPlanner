name: Deploy a Firebase Hosting (PROD)

on:
  push:
    branches:
      - main

jobs:
  deploy_to_prod:
    name: Desplegar en gymapp-d8ae7
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install

      - name: Compilar aplicación (Vite)
        run: npm run build

      - name: Deploy a Firebase Hosting (PROD)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PRO }}
          channelId: live
          projectId: gymapp-d8ae7

